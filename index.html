<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Hopper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <canvas id="game" width="960" height="544">
      Your browser does not support the HTML5 canvas.
    </canvas>
    <p class="controls">
      <b>Move</b> ← → / A D &nbsp;·&nbsp;
      <b>Jump</b> Space / ↑ / W / Z &nbsp;·&nbsp;
      <b>Drop through platform</b> ↓ / S &nbsp;·&nbsp;
      <b>Pause</b> P / Esc &nbsp;·&nbsp;
      <b>Mute</b> M
    </p>
  </main>

  <!-- Plain scripts (not ES modules) so the game runs by double-clicking index.html.
       Order matters: each file only uses things defined in the files above it. -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/level.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
